<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Top Header Bar -->
    <div class="top-header">
        <div class="header-left">
            <button class="hamburger-menu" onclick="toggleSidebar()">☰</button>
            <h1 class="page-title">Tasks</h1>
            <button class="ellipsis-btn">⋯</button>
        </div>
        <div class="header-right">
            <button class="btn-new-task" onclick="openNewTaskModal()">
                New Task <span class="dropdown-arrow">▼</span>
            </button>
            <button class="layout-btn" title="Layout options">⊞</button>
            <div class="window-controls">
                <button class="window-btn minimize">−</button>
                <button class="window-btn maximize">□</button>
                <button class="window-btn close">×</button>
            </div>
        </div>
    </div>

    <div class="dashboard-container">
        <!-- Left Sidebar -->
        <div class="sidebar" id="sidebar">
            <!-- Main Navigation -->
            <div class="nav-section">
                <div class="nav-item active" data-view="owned">
                    <span>Owned</span>
                    <span class="nav-count" id="ownedCount">42</span>
                </div>
                <div class="nav-item" data-view="subscribed">
                    <span>Subscribed</span>
                    <span class="nav-count" id="subscribedCount">0</span>
                </div>
                <div class="nav-item" data-view="activities">
                    <span>Activities</span>
                </div>
            </div>

            <!-- Quick Access -->
            <div class="nav-section">
                <div class="section-header">
                    <span>Quick Access</span>
                    <button class="toggle-btn">▼</button>
                </div>
                <div class="nav-item" data-view="all">
                    <span>All Tasks</span>
                </div>
                <div class="nav-item" data-view="created">
                    <span>Created</span>
                </div>
                <div class="nav-item" data-view="assigned">
                    <span>Assigned</span>
                </div>
                <div class="nav-item" data-view="completed">
                    <span>Completed</span>
                </div>
            </div>

            <!-- Task List -->
            <div class="nav-section">
                <div class="section-header">
                    <span>Task List</span>
                    <button class="add-btn" onclick="openNewTaskModal()">+</button>
                </div>
            </div>

            <!-- New Group -->
            <div class="nav-section">
                <div class="nav-item new-group" onclick="createNewGroup()">
                    <span>+ New Group</span>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Content Header -->
            <div class="content-header">
                <h2 class="content-title" id="contentTitle">Owned</h2>
                
                <!-- View Tabs -->
                <div class="view-tabs">
                    <button class="tab-btn active" data-view="list">List</button>
                    <button class="tab-btn" data-view="kanban">Kanban</button>
                </div>
            </div>

            <!-- Action Bar -->
            <div class="action-bar">
                <button class="btn-new-task-small" onclick="openNewTaskModal()">+ New Task</button>
                <button class="status-btn">
                    <span class="status-icon">🔄</span>
                    <span>Ongoing</span>
                </button>
                <button class="filter-btn">
                    <span class="filter-icon">🔍</span>
                    <span>Filter 1</span>
                </button>
                <div class="sort-group">
                    <span class="sort-icon">⇅</span>
                    <span>Sort by: Due Date</span>
                </div>
                <div class="group-by">
                    <span class="group-icon">📊</span>
                    <span>Group by: Creator</span>
                </div>
                <button class="customize-btn">Customize</button>
            </div>

            <!-- Task Table -->
            <div class="task-table-container">
                <table class="task-table">
                    <thead>
                        <tr>
                            <th class="checkbox-col"></th>
                            <th class="task-title-col">AΞ Task Title</th>
                            <th class="start-time-col">Start Time</th>
                            <th class="due-date-col">
                                Due Date
                                <span class="sort-indicator">↑</span>
                            </th>
                            <th class="creator-col">Creator</th>
                        </tr>
                    </thead>
                    <tbody id="tasksTableBody">
                        <!-- Tasks will be loaded here -->
                        <tr>
                            <td colspan="5" class="loading-cell">Đang tải tasks...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- New Task Modal -->
    <div id="newTaskModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeNewTaskModal()">&times;</span>
            <h2>New Task</h2>
            <form id="newTaskForm">
                <div class="form-group">
                    <label for="taskTitle">Task Title *</label>
                    <input type="text" id="taskTitle" required placeholder="Enter task title">
                </div>
                <div class="form-group">
                    <label for="taskDescription">Description</label>
                    <textarea id="taskDescription" rows="4" placeholder="Enter task description"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskStartDate">Start Date</label>
                        <input type="date" id="taskStartDate">
                    </div>
                    <div class="form-group">
                        <label for="taskDueDate">Due Date</label>
                        <input type="date" id="taskDueDate">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="taskPriority">Priority</label>
                        <select id="taskPriority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="taskStatus">Status</label>
                        <select id="taskStatus">
                            <option value="pending">Pending</option>
                            <option value="in_progress" selected>In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Create Task</button>
                    <button type="button" class="btn btn-secondary" onclick="closeNewTaskModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeProfileModal()">&times;</span>
            <h2>👤 Edit Profile</h2>
            <form id="profileForm">
                <div class="form-group">
                    <label for="profileFullName">Full Name *</label>
                    <input type="text" id="profileFullName" required placeholder="Enter full name">
                </div>
                <div class="form-group">
                    <label for="profileUsername">Username</label>
                    <input type="text" id="profileUsername" readonly style="background: #f5f5f5;">
                </div>
                <div class="form-group">
                    <label for="profileEmail">Email</label>
                    <input type="email" id="profileEmail" readonly style="background: #f5f5f5;">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeProfileModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeSettingsModal()">&times;</span>
            <h2>⚙️ Settings</h2>
            <form id="settingsForm">
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="emailNotifications">
                        <span>Enable email reminders</span>
                    </label>
                </div>
                <div class="form-group">
                    <label for="reminderBeforeDays">Remind before (days)</label>
                    <input type="number" id="reminderBeforeDays" min="0" max="30" value="1">
                </div>
                <div class="form-group">
                    <label for="reminderBeforeHours">Remind before (hours)</label>
                    <input type="number" id="reminderBeforeHours" min="0" max="23" value="24">
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" onclick="closeSettingsModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
