# Netlify configuration file
[build]
  # No build command needed for static site
  publish = "."

[[redirects]]
  # Redirect all routes to index.html for SPA behavior
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # You can add environment variables here if needed
  # SUPABASE_URL = "https://hiojtrjfatfxbffrihnx.supabase.co"
  # SUPABASE_ANON_KEY = "your-key-here"

