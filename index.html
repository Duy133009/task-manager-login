<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quản Lý Task</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Load config before app.js -->
    <script src="assets/js/config.js"></script>
</head>
<body>
    <div class="container" id="authContainer">
        <div class="form-box login">
            <form id="loginForm" onsubmit="return false;">
                <h1>Đăng Nhập</h1>
                <div class="input-box">
                    <input type="text" id="loginUsername" name="username" placeholder="Tên đăng nhập hoặc Email" required autocomplete="username">
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="loginPassword" name="password" placeholder="Mật khẩu" required autocomplete="current-password">
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="openForgotPasswordModal(); return false;">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Đăng Nhập</span>
                    <span class="btn-loader" style="display: none;">
                        <i class='bx bx-loader-alt bx-spin'></i>
                    </span>
                </button>
                <div id="loginError" class="error-message" style="display: none;"></div>
            </form>
        </div>

        <div class="form-box register">
            <form id="registerForm" onsubmit="return false;">
                <h1>Đăng Ký</h1>
                <div class="input-box">
                    <input type="text" id="registerFullName" name="fullName" placeholder="Họ và Tên" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="text" id="registerUsername" name="username" placeholder="Tên đăng nhập" required autocomplete="username">
                    <i class='bx bxs-user-circle'></i>
                </div>
                <div class="input-box">
                    <input type="email" id="registerEmail" name="email" placeholder="Email" required autocomplete="email">
                    <i class='bx bxs-envelope'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="registerPassword" name="password" placeholder="Mật khẩu" required minlength="6" autocomplete="new-password">
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu" required minlength="6" autocomplete="new-password">
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Đăng Ký</span>
                    <span class="btn-loader" style="display: none;">
                        <i class='bx bx-loader-alt bx-spin'></i>
                    </span>
                </button>
                <div id="registerError" class="error-message" style="display: none;"></div>
            </form>
        </div>

        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Xin chào!</h1>
                <p>Chưa có tài khoản?</p>
                <button type="button" class="btn register-btn">Đăng Ký</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Chào mừng trở lại!</h1>
                <p>Đã có tài khoản?</p>
                <button type="button" class="btn login-btn">Đăng Nhập</button>
            </div>
        </div>
    </div>

    <div id="successMessage" class="success-message" style="display: none;"></div>

    <div id="forgotPasswordModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-modal" onclick="closeForgotPasswordModal()">&times;</span>
            <h2>Quên Mật Khẩu</h2>
            <p style="color: #666; margin-bottom: 20px;">Nhập email để đặt lại mật khẩu</p>
            <form id="forgotPasswordForm">
                <div class="input-box">
                    <input type="email" id="forgotPasswordEmail" name="email" placeholder="Email của bạn" required autocomplete="email">
                    <i class='bx bxs-envelope'></i>
                </div>
                <div id="forgotPasswordError" class="error-message" style="display: none; margin-bottom: 15px;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span class="btn-text">Gửi yêu cầu</span>
                    <span class="btn-loader" style="display: none;">
                        <i class='bx bx-loader-alt bx-spin'></i>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <div id="resetPasswordModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-modal" onclick="document.getElementById('resetPasswordModal').style.display='none';">&times;</span>
            <h2>Đặt Lại Mật Khẩu</h2>
            <p style="color: #666; margin-bottom: 20px;">Nhập mật khẩu mới của bạn</p>
            <form id="resetPasswordForm">
                <div class="input-box">
                    <input type="password" id="resetPasswordNew" name="newPassword" placeholder="Mật khẩu mới" required minlength="6" autocomplete="new-password">
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div class="input-box">
                    <input type="password" id="resetPasswordConfirm" name="confirmPassword" placeholder="Xác nhận mật khẩu mới" required minlength="6" autocomplete="new-password">
                    <i class='bx bxs-lock-alt'></i>
                </div>
                <div id="resetPasswordError" class="error-message" style="display: none; margin-bottom: 15px;"></div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span class="btn-text">Đặt Lại Mật Khẩu</span>
                    <span class="btn-loader" style="display: none;">
                        <i class='bx bx-loader-alt bx-spin'></i>
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script>
      // Load config from config.js
      // Supabase credentials are now loaded from config.js for security
    </script>

    <!-- <script src="assets/js/app.js"></script> -->
    <script>
        // Simple toggle and form test for production
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, setting up toggle and forms...');

            const container = document.querySelector('.container');
            const registerBtns = document.querySelectorAll('.register-btn');
            const loginBtns = document.querySelectorAll('.login-btn');

            console.log('Container found:', !!container);
            console.log('Register buttons found:', registerBtns.length);
            console.log('Login buttons found:', loginBtns.length);

            // Toggle functionality
            registerBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('Register clicked - adding active');
                    container.classList.add('active');
                });
            });

            loginBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('Login clicked - removing active');
                    container.classList.remove('active');
                });
            });

            // Form handlers for testing
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (loginForm) {
                loginForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    console.log('Login form submitted');

                    const username = document.getElementById('loginUsername').value;
                    const password = document.getElementById('loginPassword').value;

                    console.log('Login attempt:', { username, passwordLength: password.length });

                    // Show success message and redirect
                    showSuccessMessage('Đăng nhập thành công! Đang chuyển đến dashboard...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                });
            }

            if (registerForm) {
                registerForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    console.log('Register form submitted');

                    const fullName = document.getElementById('registerFullName').value;
                    const username = document.getElementById('registerUsername').value;
                    const email = document.getElementById('registerEmail').value;
                    const password = document.getElementById('registerPassword').value;

                    console.log('Register attempt:', { fullName, username, email, passwordLength: password.length });

                    // Show success message and switch to login
                    showSuccessMessage('Đăng ký thành công! Đang chuyển sang đăng nhập...');
                    setTimeout(() => {
                        container.classList.remove('active');
                    }, 1500);
                });
            }

            console.log('Toggle and form setup complete');
        });

        // Success message function
        function showSuccessMessage(message) {
            // Create success message element if it doesn't exist
            let successDiv = document.getElementById('customSuccessMessage');
            if (!successDiv) {
                successDiv = document.createElement('div');
                successDiv.id = 'customSuccessMessage';
                successDiv.style.cssText = `
                    position: fixed;
                    top: 20px;
                    left: 50%;
                    transform: translateX(-50%);
                    background: linear-gradient(135deg, #4CAF50, #45a049);
                    color: white;
                    padding: 16px 24px;
                    border-radius: 12px;
                    box-shadow: 0 8px 32px rgba(76, 175, 80, 0.3);
                    font-size: 16px;
                    font-weight: 500;
                    z-index: 10000;
                    opacity: 0;
                    transition: all 0.3s ease;
                    border: 2px solid rgba(255, 255, 255, 0.2);
                    backdrop-filter: blur(10px);
                    display: flex;
                    align-items: center;
                    gap: 12px;
                `;
                document.body.appendChild(successDiv);

                // Add checkmark icon
                const icon = document.createElement('i');
                icon.className = 'bx bx-check-circle';
                icon.style.cssText = 'font-size: 24px; color: #fff;';
                successDiv.appendChild(icon);
            }

            // Set message and show
            successDiv.innerHTML = '<i class="bx bx-check-circle" style="font-size: 24px; color: #fff;"></i>' + message;
            successDiv.style.opacity = '1';
            successDiv.style.transform = 'translateX(-50%) translateY(0)';

            // Auto hide after 3 seconds
            setTimeout(() => {
                successDiv.style.opacity = '0';
                successDiv.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(() => {
                    if (successDiv.parentNode) {
                        successDiv.parentNode.removeChild(successDiv);
                    }
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
