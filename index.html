<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quản Lý Task</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Load config before app.js -->
    <script src="assets/js/config.js"></script>
</head>
<body>
    <!-- Loading indicator -->
    <div id="loading-indicator" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 9999; color: #fff; background: rgba(0, 0, 0, 0.75); padding: 24px 36px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.35);">
        <div style="font-size: 28px; margin-bottom: 10px;">⏳</div>
        <div>Đang tải dữ liệu...</div>
    </div>
    
    <div class="container" id="authContainer" style="opacity: 0; transition: opacity 0.3s;">
        <!-- Login Form -->
        <div class="form-box login">
            <form id="loginForm" action="#" method="post" onsubmit="return false;">
                <h1>Đăng Nhập</h1>
                
                <div class="input-box">
                    <input 
                        type="text" 
                        id="loginUsername" 
                        name="username" 
                        placeholder="Tên đăng nhập hoặc Email" 
                        required
                        autocomplete="username"
                    >
                    <i class='bx bxs-user'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        placeholder="Mật khẩu" 
                        required
                        autocomplete="current-password"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="loginPassword">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-link" onclick="openForgotPasswordModal(); return false;">Quên mật khẩu?</a>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Đăng Nhập</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
                
                <div id="loginError" class="error-message" style="display: none;"></div>
            </form>
        </div>

        <!-- Register Form -->
        <div class="form-box register">
            <form id="registerForm" action="#" method="post" onsubmit="return false;">
                <h1>Đăng Ký</h1>
                
                <div class="input-box">
                    <input 
                        type="text" 
                        id="registerFullName" 
                        name="fullName" 
                        placeholder="Họ và Tên" 
                        required
                    >
                    <i class='bx bxs-user'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="text" 
                        id="registerUsername" 
                        name="username" 
                        placeholder="Tên đăng nhập" 
                        required
                        autocomplete="username"
                    >
                    <i class='bx bxs-user-circle'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="email" 
                        id="registerEmail" 
                        name="email" 
                        placeholder="Email" 
                        required
                        autocomplete="email"
                    >
                    <i class='bx bxs-envelope'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="registerPassword" 
                        name="password" 
                        placeholder="Mật khẩu (tối thiểu 6 ký tự)" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="registerPassword">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Xác nhận mật khẩu" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="confirmPassword">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Đăng Ký</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
                
                <div id="registerError" class="error-message" style="display: none;"></div>
            </form>
        </div>

        <!-- Toggle Panel -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Xin chào!</h1>
                <p>Chưa có tài khoản?</p>
                <button type="button" class="btn register-btn">Đăng Ký</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Chào mừng trở lại!</h1>
                <p>Đã có tài khoản?</p>
                <button type="button" class="btn login-btn">Đăng Nhập</button>
            </div>
        </div>
    </div>

    <div id="successMessage" class="success-message" style="display: none;"></div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-modal" onclick="closeForgotPasswordModal()">&times;</span>
            <h2>Quên Mật Khẩu</h2>
            <p style="color: #666; margin-bottom: 20px;">Nhập email và mật khẩu mới của bạn</p>
            
            <form id="forgotPasswordForm">
                <div class="input-box">
                    <input 
                        type="email" 
                        id="forgotPasswordEmail" 
                        name="email" 
                        placeholder="Email của bạn" 
                        required
                        autocomplete="email"
                    >
                    <i class='bx bxs-envelope'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="forgotPasswordNew" 
                        name="newPassword" 
                        placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="forgotPasswordNew">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="forgotPasswordConfirm" 
                        name="confirmPassword" 
                        placeholder="Xác nhận mật khẩu mới" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="forgotPasswordConfirm">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <div id="forgotPasswordError" class="error-message" style="display: none; margin-bottom: 15px;"></div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span class="btn-text">Đặt Lại Mật Khẩu</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
            </form>
            
            <p style="text-align: center; margin-top: 20px;">
                <a href="#" onclick="closeForgotPasswordModal(); return false;" style="color: #7494ec;">Quay lại đăng nhập</a>
            </p>
        </div>
    </div>

    <!-- Reset Password Modal (khi user click link từ email) -->
    <div id="resetPasswordModal" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 400px;">
            <h2>Đặt Lại Mật Khẩu</h2>
            <p style="color: #666; margin-bottom: 20px;">Nhập mật khẩu mới của bạn</p>
            
            <form id="resetPasswordForm">
                <div class="input-box">
                    <input 
                        type="password" 
                        id="resetPasswordNew" 
                        name="newPassword" 
                        placeholder="Mật khẩu mới (tối thiểu 6 ký tự)" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="resetPasswordNew">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="resetPasswordConfirm" 
                        name="confirmPassword" 
                        placeholder="Xác nhận mật khẩu mới" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="resetPasswordConfirm">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <div id="resetPasswordError" class="error-message" style="display: none; margin-bottom: 15px;"></div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span class="btn-text">Đặt Lại Mật Khẩu</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Fail-safe: nếu JS chính không chạy, tự động bỏ loader sau 6s để tránh màn hình trắng
        window.__appFailSafeTimer = setTimeout(() => {
            const loader = document.getElementById('loading-indicator');
            const container = document.getElementById('authContainer');
            if (loader) loader.style.display = 'none';
            if (container) container.style.opacity = '1';
            console.warn('Fail-safe: Supabase chưa phản hồi sau 6s, hiển thị giao diện cơ bản.');
        }, 6000);
    </script>

    <!-- Scripts loaded in correct order -->
    <script src="assets/js/app.js"></script>
</body>
</html>
