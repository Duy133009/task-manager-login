<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Quản Lý Task</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container" id="authContainer">
        <!-- Login Form -->
        <div class="form-box login">
            <form id="loginForm" action="#">
                <h1>Đăng Nhập</h1>
                
                <div class="input-box">
                    <input 
                        type="text" 
                        id="loginUsername" 
                        name="username" 
                        placeholder="Tên đăng nhập hoặc Email" 
                        required
                        autocomplete="username"
                    >
                    <i class='bx bxs-user'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="loginPassword" 
                        name="password" 
                        placeholder="Mật khẩu" 
                        required
                        autocomplete="current-password"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="loginPassword">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="forgot-link">Quên mật khẩu?</a>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Đăng Nhập</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
                
                <div id="loginError" class="error-message" style="display: none;"></div>
            </form>
        </div>

        <!-- Register Form -->
        <div class="form-box register">
            <form id="registerForm" action="#">
                <h1>Đăng Ký</h1>
                
                <div class="input-box">
                    <input 
                        type="text" 
                        id="registerFullName" 
                        name="fullName" 
                        placeholder="Họ và Tên" 
                        required
                    >
                    <i class='bx bxs-user'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="text" 
                        id="registerUsername" 
                        name="username" 
                        placeholder="Tên đăng nhập" 
                        required
                        autocomplete="username"
                    >
                    <i class='bx bxs-user-circle'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="email" 
                        id="registerEmail" 
                        name="email" 
                        placeholder="Email" 
                        required
                        autocomplete="email"
                    >
                    <i class='bx bxs-envelope'></i>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="registerPassword" 
                        name="password" 
                        placeholder="Mật khẩu (tối thiểu 6 ký tự)" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="registerPassword">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <div class="input-box">
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Xác nhận mật khẩu" 
                        required
                        autocomplete="new-password"
                        minlength="6"
                    >
                    <i class='bx bxs-lock-alt'></i>
                    <button type="button" class="toggle-password-icon" data-target="confirmPassword">
                        <i class='bx bx-hide'></i>
                    </button>
                </div>
                
                <button type="submit" class="btn btn-primary">
                    <span class="btn-text">Đăng Ký</span>
                    <span class="btn-loader" style="display: none;">⏳</span>
                </button>
                
                <div id="registerError" class="error-message" style="display: none;"></div>
            </form>
        </div>

        <!-- Toggle Panel -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Xin chào!</h1>
                <p>Chưa có tài khoản?</p>
                <button type="button" class="btn register-btn">Đăng Ký</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Chào mừng trở lại!</h1>
                <p>Đã có tài khoản?</p>
                <button type="button" class="btn login-btn">Đăng Nhập</button>
            </div>
        </div>
    </div>

    <div id="successMessage" class="success-message" style="display: none;"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
