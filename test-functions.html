<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 5px; }
        .result { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Test Global Functions</h1>

    <button onclick="testFunctions()">Test All Functions</button>
    <button onclick="openNewTaskModal()">Test openNewTaskModal</button>
    <button onclick="closeNewTaskModal()">Test closeNewTaskModal</button>

    <div id="results"></div>

    <div id="newTaskModal" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 1px solid black;">
        <h2>New Task Modal</h2>
        <p>Modal is open!</p>
        <button onclick="closeNewTaskModal()">Close</button>
    </div>

    <!-- Load dependencies -->
    <script src="assets/js/core/constants.js"></script>
    <script src="assets/js/core/config.js"></script>
    <script src="assets/js/core/types/User.js"></script>
    <script src="assets/js/core/types/Task.js"></script>
    <script src="assets/js/core/interfaces/IAuthenticator.js"></script>
    <script src="assets/js/core/interfaces/ITaskRepository.js"></script>
    <script src="assets/js/core/interfaces/ITaskService.js"></script>
    <script src="assets/js/core/interfaces/IUIService.js"></script>
    <script src="assets/js/core/interfaces/IErrorHandler.js"></script>
    <script src="assets/js/services/ui/ToastUIService.js"></script>
    <script src="assets/js/services/ui/ToastService.js"></script>
    <script src="assets/js/services/ui/ConfettiService.js"></script>
    <script src="assets/js/services/ui/ErrorHandler.js"></script>
    <script src="assets/js/services/auth/SupabaseAuthenticator.js"></script>
    <script src="assets/js/services/auth/AuthService.js"></script>
    <script src="assets/js/services/tasks/TaskValidator.js"></script>
    <script src="assets/js/services/tasks/TaskRepository.js"></script>
    <script src="assets/js/services/tasks/TaskService.js"></script>
    <script src="assets/js/controllers/AuthController.js"></script>
    <script src="assets/js/controllers/TaskController.js"></script>
    <script src="assets/js/controllers/KanbanController.js"></script>
    <script src="assets/js/utils/validation.js"></script>
    <script src="assets/js/app.js"></script>

    <script>
        function testFunctions() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            const functionsToTest = [
                'openNewTaskModal',
                'closeNewTaskModal',
                'handleNewTask',
                'toggleSidebar',
                'logout',
                'createNewGroup',
                'openProfileModal',
                'closeProfileModal',
                'openSettings',
                'closeSettingsModal',
                'toggleStatusFilter',
                'openFilterModal',
                'closeFilterModal',
                'applyFilters',
                'clearFilters',
                'openSortMenu',
                'setSort',
                'toggleGroupBy',
                'toggleDarkMode'
            ];

            functionsToTest.forEach(funcName => {
                const exists = typeof window[funcName] === 'function';
                const div = document.createElement('div');
                div.className = 'result ' + (exists ? 'success' : 'error');
                div.textContent = `${funcName}: ${exists ? '✓ Available' : '✗ Not Available'}`;
                resultsDiv.appendChild(div);
            });
        }

        // Test immediately
        setTimeout(testFunctions, 1000);
    </script>
</body>
</html>
