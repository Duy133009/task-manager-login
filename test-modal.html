<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modal</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; margin: 10px; cursor: pointer; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .modal-content {
            background: white;
            margin: 10% auto;
            padding: 20px;
            width: 50%;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Test Modal Functions</h1>
    <button onclick="openNewTaskModal()">Open New Task Modal</button>
    <button onclick="closeNewTaskModal()">Close Modal</button>

    <div id="newTaskModal" class="modal">
        <div class="modal-content">
            <span onclick="closeNewTaskModal()" style="float: right; cursor: pointer;">&times;</span>
            <h2>New Task</h2>
            <form id="newTaskForm" onsubmit="handleNewTask(event)">
                <input type="text" id="taskTitle" placeholder="Task title" required><br><br>
                <button type="submit">Create Task</button>
                <button type="button" onclick="closeNewTaskModal()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- Load SOLID Architecture Dependencies -->
    <script src="assets/js/core/constants.js"></script>
    <script src="assets/js/core/config.js"></script>

    <!-- Load Types -->
    <script src="assets/js/core/types/User.js"></script>
    <script src="assets/js/core/types/Task.js"></script>

    <!-- Load Interfaces -->
    <script src="assets/js/core/interfaces/IAuthenticator.js"></script>
    <script src="assets/js/core/interfaces/ITaskRepository.js"></script>
    <script src="assets/js/core/interfaces/ITaskService.js"></script>
    <script src="assets/js/core/interfaces/IUIService.js"></script>
    <script src="assets/js/core/interfaces/IErrorHandler.js"></script>

    <!-- Load Services -->
    <script src="assets/js/services/ui/ToastUIService.js"></script>
    <script src="assets/js/services/ui/ToastService.js"></script>
    <script src="assets/js/services/ui/ConfettiService.js"></script>
    <script src="assets/js/services/ui/ErrorHandler.js"></script>
    <script src="assets/js/services/auth/SupabaseAuthenticator.js"></script>
    <script src="assets/js/services/auth/AuthService.js"></script>
    <script src="assets/js/services/tasks/TaskValidator.js"></script>
    <script src="assets/js/services/tasks/TaskRepository.js"></script>
    <script src="assets/js/services/tasks/TaskService.js"></script>

    <!-- Load Controllers -->
    <script src="assets/js/controllers/AuthController.js"></script>
    <script src="assets/js/controllers/TaskController.js"></script>
    <script src="assets/js/controllers/KanbanController.js"></script>

    <!-- Load Utils -->
    <script src="assets/js/utils/validation.js"></script>

    <!-- Load Main Application -->
    <script src="assets/js/app.js"></script>

    <script>
        // Mock the authentication and initialization for testing
        console.log('Test page loaded');

        // Override the DOMContentLoaded to prevent full app initialization
        document.addEventListener('DOMContentLoaded', (e) => {
            e.preventDefault();
            console.log('DOMContentLoaded prevented for test');

            // Mock taskController for testing
            window.taskController = {
                openCreateTaskModal: () => {
                    console.log('openCreateTaskModal called');
                    document.getElementById('newTaskModal').style.display = 'block';
                },
                closeCreateTaskModal: () => {
                    console.log('closeCreateTaskModal called');
                    document.getElementById('newTaskModal').style.display = 'none';
                },
                createTask: async (taskData) => {
                    console.log('createTask called with:', taskData);
                    alert('Task created: ' + taskData.title);
                    document.getElementById('newTaskModal').style.display = 'none';
                }
            };

            // Set global functions
            window.openNewTaskModal = () => window.taskController.openCreateTaskModal();
            window.closeNewTaskModal = () => window.taskController.closeCreateTaskModal();
            window.handleNewTask = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const taskData = {
                    title: formData.get('taskTitle')?.trim(),
                    description: '',
                    priority: 'medium',
                    status: 'pending',
                    due_date: null,
                    assigned_to: null
                };
                await window.taskController.createTask(taskData);
            };

            console.log('Test functions set up');
        });
    </script>
</body>
</html>
